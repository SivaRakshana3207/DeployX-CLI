<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Deployment History — DeployX</title>
</head>

<body class="min-h-screen bg-slate-950 text-white">
    <nav class="border-b border-slate-800">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
            <a href="/" class="text-2xl font-black"><span class="text-cyan-400">Deploy</span>X</a>
            <a href="/dashboard" class="text-sm text-slate-300 hover:text-white">Dashboard</a>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-6 py-10">
        <h1 class="text-4xl font-black">Deployment History</h1>
        <p class="mt-3 text-slate-400">Every deployment record created by the DeployX CLI.</p>

        <div class="mt-10 space-y-4">
            {% for d in deployments %}
            <a href="/deployment/{{ d.id }}"
               class="block rounded-2xl border border-slate-800 bg-slate-900 p-6 transition hover:border-cyan-400/50">
                <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">
                    <div>
                        <p class="text-sm font-bold text-cyan-400">DEP-{{ "%05d"|format(d.id) }}</p>
                        <h2 class="mt-1 text-xl font-bold">{{ d.project_name }}</h2>
                        <p class="mt-2 text-sm text-slate-500">
                            {{ d.framework }} • {{ d.created_at }}
                        </p>
                    </div>
                    <span class="rounded-full bg-amber-400/10 px-4 py-2 text-xs font-bold text-amber-300">
                        {{ d.status }}
                    </span>
                </div>
            </a>
            {% else %}
            <div class="rounded-2xl border border-dashed border-slate-700 p-12 text-center text-slate-500">
                No deployment history yet.
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
